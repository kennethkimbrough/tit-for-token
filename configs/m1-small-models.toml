# Milestone 1: four inexpensive models from different labs against each other and the classic bots.
#
# Model ids are OpenRouter ids; check https://openrouter.ai/models for current ids and prices
# before running, and put each model's prices here so the spending cap is accurate.
# Set OPENROUTER_API_KEY in the environment. Never put a key in this file.

name = "m1-small-models"
seed = 20261030
matches_per_pairing = 10
end_probability = 0.1
spending_cap_usd = 5.0
self_play = true

bots = ["always-cooperate", "always-defect", "tit-for-tat", "grim-trigger", "random"]

[model_defaults]
temperature = 0.7
max_tokens = 50

[[models]]
name = "haiku"
model = "anthropic/claude-haiku-5.5"
concurrency = 4
[models.price]
input_usd_per_million = 1.00
output_usd_per_million = 5.00

[[models]]
name = "gpt-mini"
model = "openai/gpt-5-mini"
concurrency = 4
[models.price]
input_usd_per_million = 0.25
output_usd_per_million = 2.00

[[models]]
name = "gemini-flash"
model = "google/gemini-2.5-flash"
concurrency = 4
[models.price]
input_usd_per_million = 0.30
output_usd_per_million = 2.50

[[models]]
name = "qwen"
model = "qwen/qwen3-32b"
concurrency = 4
[models.price]
input_usd_per_million = 0.10
output_usd_per_million = 0.30
