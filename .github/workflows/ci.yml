name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Replay every committed run from its recording
        run: |
          status=0
          for run in runs/*/; do
            [ -f "$run/matches.jsonl" ] || continue
            python -m tit_for_token check "$run" || status=1
          done
          exit $status
