name: Results site

# Builds the results site from the committed run and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://kennethkimbrough.github.io/tit-for-token/
# The site is generated from runs/ on every push, so it cannot drift from the data.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  RUN_DIR: runs/m1-small-models
  FEATURED_MATCH: haiku--gemini-flash--003
  COMPARE_DIR: runs/m3-named

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Check the run replays exactly before publishing it
        run: |
          python -m tit_for_token check "$RUN_DIR"
          python -m tit_for_token check "$COMPARE_DIR"
      - name: Build the site
        run: python -m tit_for_token site "$RUN_DIR" --out site --featured "$FEATURED_MATCH" --compare "$COMPARE_DIR"
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy results site"

  verify:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the site to answer
        run: |
          url="https://kennethkimbrough.github.io/tit-for-token/"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ] && curl -s "$url" | grep -q "tit-for-token"; then
              echo "::notice title=Live site::$url is serving the results site (HTTP 200)"
              exit 0
            fi
            sleep 15
          done
          echo "::error title=Live site::$url did not answer (last HTTP $code). Enable GitHub Pages from the gh-pages branch in Settings > Pages."
          exit 1
