name: Tournament

# Runs a tournament live on GitHub's machines, using the OPENROUTER_API_KEY repository secret,
# so the key never has to exist anywhere else. Started by hand from the Actions tab.
#
# Whatever happens (finished, budget stop, error, cancelled, timed out), the run directory is
# pushed to its own branch, results/<config name>-<run number>, for review. Nothing is committed
# to main automatically; a reviewed run is copied into runs/ by hand.

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Tournament config"
        required: true
        default: "configs/m1-dry-run.toml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Play the tournament
        timeout-minutes: 120
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONFIG: ${{ inputs.config }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add the OPENROUTER_API_KEY repository secret first."
            exit 1
          fi
          python -u -m tit_for_token run "$CONFIG" --out run 2>&1 | tee run-log.txt
          exit "${PIPESTATUS[0]}"
      - name: Report
        if: always()
        run: |
          mkdir -p run
          [ -f run-log.txt ] && cp run-log.txt run/log.txt
          if [ -f run/matches.jsonl ]; then
            { echo '```'; cat run/run.json 2>/dev/null; echo '```'; python -m tit_for_token report run --reps 1000; } > run/report.md || true
            cat run/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Push the run directory to a results branch
        if: always()
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          [ -d run ] || exit 0
          name=$(basename "$CONFIG" .toml)
          branch="results/${name}-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$branch"
          git rm -rfq --cached . > /dev/null
          git add -f run
          git commit -qm "Tournament run ${name} (workflow run ${GITHUB_RUN_ID})"
          git push -q origin "$branch"
          echo "Results pushed to branch $branch" >> "$GITHUB_STEP_SUMMARY"
