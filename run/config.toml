# Milestone 3, the framing experiment: the same four models, told they are playing the iterated
# prisoner's dilemma, with option A labelled "cooperate" and option B "defect". Every other word of
# the prompt, every setting and every match is the same as milestone 1.
#
# The seed, match ids and player order are milestone 1's, so each match here has the same id, seed
# and length as a match in runs/m1-small-models (the neutral arm, which costs nothing to reuse).
# `python -m tit_for_token compare runs/m1-small-models runs/m3-named` gives the paired change.
# Three bots stay as probes: Always Cooperate (does the model exploit?), Always Defect (does it
# retaliate and forgive?) and Tit-for-Tat. Grim Trigger and Random are dropped to save calls.
#
# Model ids are OpenRouter ids. Set OPENROUTER_API_KEY in the environment. Never put a key in this file.
# Do the dry run (m3-named-dry-run.toml) first and check "Cut off" and "Forfeits" are 0% for every model.


name = "m3-named-dry-run"
seed = 20261030
matches_per_pairing = 1
end_probability = 0.1
spending_cap_usd = 1.0
self_play = true
framing = "named"

bots = ["always-cooperate", "always-defect", "tit-for-tat"]

[model_defaults]
temperature = 0.7
max_tokens = 2000

# Prices are USD per million tokens, rounded up from OpenRouter's listings so the cap errs on the safe side.

[[models]]
name = "haiku"
model = "anthropic/claude-haiku-5.5"
reasoning = "low"
concurrency = 4
[models.price]
input_usd_per_million = 1.00
output_usd_per_million = 5.00

[[models]]
name = "gpt-mini"
model = "openai/gpt-5-mini"
reasoning = "low"
concurrency = 4
[models.price]
input_usd_per_million = 0.25
output_usd_per_million = 2.00

[[models]]
name = "gemini-flash"
model = "google/gemini-2.5-flash"
reasoning = "low"
concurrency = 4
[models.price]
input_usd_per_million = 0.30
output_usd_per_million = 2.50

[[models]]
name = "deepseek-flash"
model = "deepseek/deepseek-v4.1-flash"
reasoning = "low"
max_tokens = 4000   # thinks at length even at low effort: median ~520 tokens, longest over 2,000 in the dry run
concurrency = 4
[models.price]
input_usd_per_million = 0.05
output_usd_per_million = 1.00
