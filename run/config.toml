# Dry run of m1-small-models: identical players and settings, one match per pairing (about 400 calls, well under a dollar).
# Run this first and check the report's "Cut off" and "Forfeits" columns before the full run.
# Keep the [[models]] blocks in sync with m1-small-models.toml.
#
# Model ids are OpenRouter ids; check https://openrouter.ai/models for current ids and prices
# before running, and put each model's prices here so the spending cap is accurate.
# Set OPENROUTER_API_KEY in the environment. Never put a key in this file.
#
# All four models reason, and providers count hidden reasoning against max_tokens. So every model
# plays under the same condition, low reasoning effort, with a 2,000-token cap that leaves room for
# the answer after the thinking. The README states this condition with the results.
# Do a dry run first and check the report's "Cut off" and "Forfeits" columns are 0% for every model.


name = "m1-dry-run"
seed = 20261030
matches_per_pairing = 1
end_probability = 0.1
spending_cap_usd = 2.0
self_play = true

bots = ["always-cooperate", "always-defect", "tit-for-tat", "grim-trigger", "random"]

[model_defaults]
temperature = 0.7
max_tokens = 2000

# Prices are USD per million tokens, rounded up from OpenRouter's listings so the cap errs on the safe side.

[[models]]
name = "haiku"
model = "anthropic/claude-haiku-5.5"
reasoning = "low"
concurrency = 4
[models.price]
input_usd_per_million = 1.00
output_usd_per_million = 5.00

[[models]]
name = "gpt-mini"
model = "openai/gpt-5-mini"
reasoning = "low"
concurrency = 4
[models.price]
input_usd_per_million = 0.25
output_usd_per_million = 2.00

[[models]]
name = "gemini-flash"
model = "google/gemini-2.5-flash"
reasoning = "low"
concurrency = 4
[models.price]
input_usd_per_million = 0.30
output_usd_per_million = 2.50

[[models]]
name = "deepseek-flash"
model = "deepseek/deepseek-v4.1-flash"
reasoning = "low"
concurrency = 4
[models.price]
input_usd_per_million = 0.05
output_usd_per_million = 1.00
