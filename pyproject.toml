[project]
name = "tit-for-token"
version = "0.1.0"
description = "Repeated strategic games between language models, measured and reproducible"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tit-for-token = "tit_for_token.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tit_for_token*"]

[tool.setuptools.package-data]
tit_for_token = ["site_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
